name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: '0 0 * * 1'
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - uses: ossf/scorecard-action@v2.3.1
